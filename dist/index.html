<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HELURIO Kids Fit Studio — 语音控制的儿童智能试衣间。" />
    <meta name="theme-color" content="#f2efe8" />
    <title>HELURIO Kids Fit Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23181513'/%3E%3Cpath d='M10 8h3v6h6V8h3v16h-3v-7h-6v7h-3z' fill='%23f5f1e8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="HELURIO 首页">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span>
            <strong>HELURIO</strong>
            <small>KIDS FIT STUDIO</small>
          </span>
        </a>
        <div class="top-actions">
          <span class="system-pill" id="systemState"><i></i> 等待启动</span>
          <button class="icon-button" id="settingsButton" type="button" aria-label="接口设置" title="接口设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.01V3h4v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="studio-panel" aria-label="实时试衣画面">
          <div class="section-heading">
            <div>
              <span class="eyebrow">HELURIO MIRROR · 01</span>
              <h1>试穿，从一句话开始</h1>
            </div>
            <button class="secondary-button" id="cameraButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10l4.5-2.5v9L15 14M5 6h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/></svg>
              打开摄像头
            </button>
          </div>

          <div class="mirror-frame" id="mirrorFrame">
            <video id="outputVideo" autoplay playsinline muted></video>
            <video id="inputVideo" autoplay playsinline muted></video>
            <div class="camera-empty" id="cameraEmpty">
              <div class="camera-orbit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10l4.5-2.5v9L15 14M5 6h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/></svg>
              </div>
              <strong>镜子还没有打开</strong>
              <span>允许摄像头后，站在画面中央</span>
            </div>
            <div class="live-badge"><i></i> <span id="liveLabel">PREVIEW</span></div>
            <div class="look-summary" id="lookSummary">
              <span>当前搭配</span>
              <strong id="lookText">还没有选择服装</strong>
            </div>
          </div>

          <div class="voice-console">
            <button class="mic-button" id="micButton" type="button" aria-label="开始语音选择">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
            </button>
            <div class="voice-copy">
              <label for="commandInput">语音选择</label>
              <input id="commandInput" type="text" autocomplete="off" placeholder="试试说：给我穿黄色上衣和黑色裤子" />
              <span id="voiceHint">点击麦克风，说出颜色与款式</span>
            </div>
            <button class="send-button" id="sendButton" type="button">应用</button>
          </div>
        </section>

        <aside class="wardrobe-panel" aria-label="儿童衣橱">
          <div class="wardrobe-heading">
            <div>
              <span class="eyebrow">THE JUNIOR WARDROBE · 10</span>
              <h2>本季衣橱</h2>
            </div>
            <span class="startlux-badge">由 STARTLUX 选择</span>
          </div>
          <div class="tabs" role="tablist" aria-label="服装类别">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-filter="top">上衣 <span>5</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-filter="bottom">裤装 <span>5</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-filter="all">全部 <span>10</span></button>
          </div>
          <div class="catalog-grid" id="catalogGrid" aria-live="polite"></div>
          <div class="decision-strip">
            <div class="decision-icon">S</div>
            <div>
              <strong id="decisionTitle">STARTLUX 尚未判断</strong>
              <span id="decisionDetail">语音指令会发送到本地模型</span>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card" id="settingsForm">
        <div class="modal-heading">
          <div><span class="eyebrow">CONNECTIONS</span><h2>接口设置</h2></div>
          <button class="icon-button" value="cancel" aria-label="关闭设置" type="submit">×</button>
        </div>
        <label>STARTLUX 接口地址<input id="startluxEndpoint" type="url" value="http://127.0.0.1:8000/v1/systemone" required /></label>
        <label>STARTLUX 模型名<input id="startluxModel" type="text" value="startlux" required /></label>
        <label>本地语音转写接口<input id="speechEndpoint" type="url" value="http://127.0.0.1:8001/v1/audio/transcriptions" /></label>
        <label>Lucy API Key<input id="lucyKey" type="password" placeholder="仅保存在本次浏览器会话" /></label>
        <p>浏览器原生语音不可用时，会把录音发送到本地 OpenAI-compatible 转写接口。STARTLUX 与转写服务都需允许页面来源的 CORS 请求。</p>
        <div class="modal-actions">
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button class="primary-button" id="saveSettings" value="default" type="submit">保存设置</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
